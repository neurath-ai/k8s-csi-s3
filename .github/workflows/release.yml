name: Release owned CSI artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.43.7-neurath.1
  DRIVER_IMAGE: dmorozoff/csi-s3-driver:0.43.7-neurath.1
  REGISTRAR_IMAGE: dmorozoff/csi-node-driver-registrar:v2.16.0-neurath.1
  PROVISIONER_IMAGE: dmorozoff/csi-provisioner:v6.2.0-neurath.1
  REGISTRAR_SOURCE: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
  PROVISIONER_SOURCE: registry.k8s.io/sig-storage/csi-provisioner@sha256:6be9f63ca4caa6c46aae55aa372500949d8a21473d72f819da1f746076b32d4e
  CHART_REF: oci://registry-1.docker.io/dmorozoff/csi-s3
  GEESEFS_COMMIT: 8da9c52980192bcae9f777a03b00dfd993b0e398

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: dockerhub-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify owned source and compile targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/geesefs rev-parse HEAD)" = "$GEESEFS_COMMIT"
          test "$(git -C third_party/geesefs remote get-url origin)" = "https://github.com/neurath-ai/geesefs.git"
          go test ./...
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/s3driver-$arch" ./cmd/s3driver
            (
              cd third_party/geesefs
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/geesefs-$arch" .
            )
          done

      - name: Verify chart defaults
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/csi-s3
          helm template csi-s3 deploy/helm/csi-s3 > /tmp/csi-s3-rendered.yaml
          grep -Fq "image: $DRIVER_IMAGE" /tmp/csi-s3-rendered.yaml
          grep -Fq "image: $REGISTRAR_IMAGE" /tmp/csi-s3-rendered.yaml
          grep -Fq "image: $PROVISIONER_IMAGE" /tmp/csi-s3-rendered.yaml
          if grep -Eq 'cr\.yandex|yandex-cloud\.github\.io|storage\.yandexcloud\.net' /tmp/csi-s3-rendered.yaml; then
            echo "Rendered chart contains a Yandex-controlled endpoint or registry" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: dmorozoff
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite published artifacts
        shell: bash
        run: |
          set -euo pipefail
          for image in "$DRIVER_IMAGE" "$REGISTRAR_IMAGE" "$PROVISIONER_IMAGE"; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Artifact already exists: $image" >&2
              exit 1
            fi
          done
          if helm show chart "$CHART_REF" --version "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Chart already exists: $CHART_REF:$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Publish multi-architecture driver
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --tag "$DRIVER_IMAGE"
          --push .

      - name: Mirror pinned sidecars
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$REGISTRAR_IMAGE" "$REGISTRAR_SOURCE"
          docker buildx imagetools create --tag "$PROVISIONER_IMAGE" "$PROVISIONER_SOURCE"

      - name: Publish OCI chart
        shell: bash
        run: |
          set -euo pipefail
          helm package deploy/helm/csi-s3 --destination /tmp
          helm push "/tmp/csi-s3-$RELEASE_VERSION.tgz" oci://registry-1.docker.io/dmorozoff

      - name: Verify published ownership and platforms
        shell: bash
        run: |
          set -euo pipefail
          for image in "$DRIVER_IMAGE" "$REGISTRAR_IMAGE" "$PROVISIONER_IMAGE"; do
            manifest="$(docker buildx imagetools inspect "$image")"
            grep -Fq 'linux/amd64' <<< "$manifest"
            grep -Fq 'linux/arm64' <<< "$manifest"
          done
          helm template csi-s3 "$CHART_REF" --version "$RELEASE_VERSION" > /tmp/published-csi-s3.yaml
          grep -Fq "image: $DRIVER_IMAGE" /tmp/published-csi-s3.yaml
          grep -Fq "image: $REGISTRAR_IMAGE" /tmp/published-csi-s3.yaml
          grep -Fq "image: $PROVISIONER_IMAGE" /tmp/published-csi-s3.yaml
          if grep -Eq 'cr\.yandex|yandex-cloud\.github\.io|storage\.yandexcloud\.net' /tmp/published-csi-s3.yaml; then
            echo "Published chart contains a Yandex-controlled endpoint or registry" >&2
            exit 1
          fi

  native-pull:
    needs: publish
    environment: dockerhub-release
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: dmorozoff
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull native images
        shell: bash
        run: |
          set -euo pipefail
          for image in "$DRIVER_IMAGE" "$REGISTRAR_IMAGE" "$PROVISIONER_IMAGE"; do
            docker pull "$image"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "${{ matrix.arch }}"
          done
          docker run --rm --entrypoint /bin/sh "$DRIVER_IMAGE" -c 'test -x /s3driver && test -x /usr/bin/geesefs'
